# Render Deployment Configuration for Kazon India (Static Site with Pre-rendered HTML Snapshots)
services:
  - type: web
    name: kazon-india
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      # Serve clean pre-rendered HTML files
      - type: rewrite
        source: /*
        destination: /index.html
